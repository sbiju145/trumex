<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Trumex Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Product Management</h2>

<form>

<label>Product Image</label><br>
<input type="file" accept="image/*"><br><br>

<label>Product Name</label><br>
<input type="text" placeholder="Product Name"><br><br>

<label>Category</label><br>
<input type="text" placeholder="Category"><br><br>

<label>Brand</label><br>
<input type="text" placeholder="Brand"><br><br>

<label>MRP</label><br>
<input type="number" placeholder="₹ MRP"><br><br>

<label>Selling Price</label><br>
<input type="number" placeholder="₹ Selling Price"><br><br>

<label>Discount (%)</label><br>
<input type="number" placeholder="Discount %"><br><br>

<label>Stock</label><br>
<input type="number" placeholder="Stock"><br><br>

<label>Description</label><br>
<textarea rows="5" placeholder="Description"></textarea><br><br>

<button type="submit">Save Product</button>

</form>

</body>
</html>
