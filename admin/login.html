<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trumex Admin Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-box">

<h1>TRUMEX</h1>
<p>Admin Panel</p>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
LOGIN
</button>

</form>

</div>

<script src="js/login.js"></script>

</body>
</html>
