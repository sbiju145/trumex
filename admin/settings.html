<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Trumex Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h2>Website Settings</h2>

<form>

<label>Website Name</label><br>
<input type="text" placeholder="Trumex Store"><br><br>

<label>Logo</label><br>
<input type="file" accept="image/*"><br><br>

<label>Favicon</label><br>
<input type="file" accept="image/*"><br><br>

<label>Email</label><br>
<input type="email" placeholder="admin@example.com"><br><br>

<label>Phone</label><br>
<input type="tel" placeholder="+91xxxxxxxxxx"><br><br>

<label>WhatsApp</label><br>
<input type="tel" placeholder="+91xxxxxxxxxx"><br><br>

<label>Address</label><br>
<textarea rows="4"></textarea><br><br>

<label>Facebook</label><br>
<input type="url"><br><br>

<label>Instagram</label><br>
<input type="url"><br><br>

<label>YouTube</label><br>
<input type="url"><br><br>

<label>X (Twitter)</label><br>
<input type="url"><br><br>

<button type="submit">Save Settings</button>

</form>

</body>
</html>
